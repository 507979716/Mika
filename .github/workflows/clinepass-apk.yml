          +        assertEquals(listOf("high"), declared.levels)
          +        assertTrue(declared.fromProvider)
          +        assertEquals(emptyList<String>(), ReasoningOptions.of(cfg, ListedModel(model, reasoning = false))!!.levels)
          +        assertEquals(emptyList<String>(), ReasoningOptions.of(cfg, ListedModel(model, reasoningEfforts = emptyList()))!!.levels)
          +    }
          +
