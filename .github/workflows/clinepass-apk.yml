          +        assertEquals(listOf("none", "low", "high", "max"), ReasoningOptions.of(cfg, null)!!.levels)
          +        assertNull(ReasoningOptions.of(cfg.copy(model = "cline-pass/other"), null))
          +        assertNull(ReasoningOptions.of(cfg.copy(baseUrl = "https://api.cline.bot.example/api/v1"), null))
          +        assertNull(ReasoningOptions.of(cfg.copy(kind = ProviderConfig.Kind.Anthropic), null))
