name: Build Mika ClinePass APK

# Add this file at .github/workflows/clinepass-apk.yml in your GitHub repository.
# No Cline API key or other secret is needed. Enter your key in the installed app.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mika-clinepass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out pinned upstream Mika source
        uses: actions/checkout@v7.0.1
        with:
          repository: wangzan101/Mika
          ref: 5d3c7f9c0ce521812632674776b780a1b4bbf58a
          path: Mika
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Apply ClinePass compatibility patch
        working-directory: Mika
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/clinepass.patch" <<'CLINEPASS_PATCH'
          diff --git a/app/build.gradle.kts b/app/build.gradle.kts
          index cb4685c..fafbf60 100644
          --- a/app/build.gradle.kts
          +++ b/app/build.gradle.kts
          @@ -26,6 +26,14 @@ android {
                   buildConfigField("boolean", "BETA", "true")
               }
           
          +    // 个人 ClinePass 适配包与官方版并存,使用本次构建自己的签名和独立数据目录。
          +    if (providers.gradleProperty("clinePassBuild").isPresent) {
          +        defaultConfig {
          +            applicationId = "com.wangzan101.mika.clinepass"
          +            versionName = "0.1.38-clinepass"
          +        }
          +    }
          +
               // 沙箱程序只有 arm64 版本(jniLibs/arm64-v8a);APK 不限 ABI,别的设备照常安装、显示「此设备不支持沙箱」。
               // 沙箱程序要从 nativeLibraryDir 直接执行,安装时必须解到磁盘
               packaging { jniLibs { useLegacyPackaging = true } }
          diff --git a/app/src/main/java/com/wangzan101/mika/settings/ReasoningOptions.kt b/app/src/main/java/com/wangzan101/mika/settings/ReasoningOptions.kt
