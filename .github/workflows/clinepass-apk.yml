          diff --git a/core/src/main/kotlin/com/wangzan101/mika/core/model/OpenAiCompatModel.kt b/core/src/main/kotlin/com/wangzan101/mika/core/model/OpenAiCompatModel.kt
          index f03c876..229bc5c 100644
          --- a/core/src/main/kotlin/com/wangzan101/mika/core/model/OpenAiCompatModel.kt
